name: Deploy Admin

on:
  push:
    branches: [main]
    paths:
      - 'projects/admin-web/**'
      - 'projects/shared/**'
      - 'package.json'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:admin
      # TODO: publish dist/admin-web/browser to the static host (Cloudflare Pages).
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-web
          path: dist/admin-web/browser
